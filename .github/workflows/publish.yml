name: publish

on:
  push:
    tags: ['react-v*']

permissions:
  contents: read

env:
  REGISTRY: https://repo.relteco.com/repository/npm-relteco/

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/react
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check the tag matches the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "react-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish @quanarch/react
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_PUBLISH_USERNAME || vars.NEXUS_PUBLISH_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PUBLISH_PASSWORD || vars.NEXUS_PUBLISH_PASSWORD }}
        run: |
          if [ -z "$NEXUS_USERNAME" ] || [ -z "$NEXUS_PASSWORD" ]; then
            echo "NEXUS_PUBLISH_USERNAME and NEXUS_PUBLISH_PASSWORD must be set for this repository"
            exit 1
          fi
          auth="$(printf '%s:%s' "$NEXUS_USERNAME" "$NEXUS_PASSWORD" | base64 -w0)"
          echo "::add-mask::$auth"
          host="${REGISTRY#https:}"
          printf '%s:_auth=%s\n' "$host" "$auth" > "$RUNNER_TEMP/.npmrc"
          npm publish --registry "$REGISTRY" --userconfig "$RUNNER_TEMP/.npmrc"
