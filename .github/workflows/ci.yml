name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: quanarch/quanarch
          ref: dev
          path: .qu
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-go@v7
        with:
          go-version-file: .qu/go.mod
          cache-dependency-path: .qu/go.sum
      - name: Create a project from this stack and add a quan with a new qua
        run: go test -C .qu ./internal/create -run TestStackProject -count=1 -v
        env:
          QU_E2E_STACK_DIR: ${{ github.workspace }}
      - name: Build qu
        run: go build -C .qu -o "$RUNNER_TEMP/qu" ./cmd/qu
      - name: Build every part of a project made by qu
        working-directory: ${{ runner.temp }}
        env:
          QU_STACK_DIR: ${{ github.workspace }}
        run: |
          ./qu new project acme --lang react-ts --dir . --qua acme-qua --quanar acme-quanar --quan billing
          ./qu new quan invoices --lang react-ts --dir acme --new-qua invoices-qua
          for quan in billing invoices; do
            (cd acme/quans/$quan && npm run typecheck && npm run build)
          done
          (cd acme/quanar && npm run build)
      - name: A quan uses the quanar's React and publishes its manifest on window
        working-directory: ${{ runner.temp }}/acme/quans/billing/dist
        run: |
          if grep -q react.transitional.element billing.js; then echo "the quan bundles its own React"; exit 1; fi
          grep -q window.BillingQuan billing.js
