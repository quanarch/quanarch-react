name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/checkout@v7
        with:
          repository: quanarch/quanarch
          ref: dev
          path: .qu
      - uses: actions/setup-go@v7
        with:
          go-version-file: .qu/go.mod
          cache-dependency-path: .qu/go.sum
      - name: Build qu
        run: go build -C .qu -o "$RUNNER_TEMP/qu" ./cmd/qu
      - run: scripts/e2e.sh
        env:
          QU: ${{ runner.temp }}/qu
