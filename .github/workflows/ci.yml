name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: quanarch/quanarch
          ref: dev
          path: .qu
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-go@v7
        with:
          go-version-file: .qu/go.mod
          cache-dependency-path: .qu/go.sum
      - name: Create a project from this stack and build every part
        run: go test -C .qu ./internal/create -run TestStackProject -count=1 -v
        env:
          QU_E2E_STACK_DIR: ${{ github.workspace }}
